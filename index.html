<!DOCTYPE html>
<html>
<head>
<title>Hi!</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px;
  background-color: #f0f0f0;
}
h1 {
  font-size: 3em;
  animation: color-change 5s infinite;
}
p {
  font-size: 1.5em;
}

@keyframes color-change {
  0% { color: #e91e63; }
  25% { color: #673ab7; }
  50% { color: #3f51b5; }
  75% { color: #00bcd4; }
  100% { color: #e91e63; }
}
</style>
</head>
<body>
  <h1>BADING</h1>
  <p>UHLOL</p>
</body>
</html>
